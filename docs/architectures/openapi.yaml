openapi: 3.0.3
info:
  title: Task Management System API
  description: API для систмемы управления задачами на Raspberry Pi
  version: 1.0.0
servers:
  - url: https://{raspberry_pi_ip}/api/v1
    variables:
      raspberry_pi_ip:
        default: 192.168.1.100
        description: IP-адрес Raspberry Pi

security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      summary: Аутентификация пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверные учетные данные

  /tasks:
    get:
      summary: Получить список задач
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, in_progress, done]
        - name: updated_since
          in: query
          description: Для синхронизации — получить задачи, обновленные после указанной даты
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Список задач
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Создать новую задачу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /tasks/{taskId}:
    get:
      summary: Получить задачу по ID
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Детали задачи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Задача не найдена
    put:
      summary: Обновить задачу (используется для синхронизации)
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '409':
          description: Конфликт версий (устаревшие данные)
    delete:
      summary: Удалить задачу
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Задача удалена

  /tasks/{taskId}/attachments:
    post:
      summary: Загрузить вложение к задаче
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Файл загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'

  /sync:
    get:
      summary: Синхронизация (получить все изменения)
      parameters:
        - name: last_sync
          in: query
          required: true
          description: Время последней синхронизации клиента
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Данные для синхронизации
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  deleted_task_ids:
                    type: array
                    items:
                      type: string
                      format: uuid

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expires_in:
          type: integer

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
        due_date:
          type: string
          format: date-time
        version:
          type: integer
          description: Версия для разрешения конфликтов синхронизации
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date-time

    TaskUpdate:
      type: object
      required: [version]
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
        due_date:
          type: string
          format: date-time
        version:
          type: integer
          description: Текущая версия задачи (для оптимистичной блокировки)

    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        size:
          type: integer
        url:
          type: string
          format: uri
